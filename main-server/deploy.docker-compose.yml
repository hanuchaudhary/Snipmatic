services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
  # API Gateway - FastAPI application
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8000:8000"  # Expose API Gateway port
    env_file:
      - ./.env
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped

  # Download Workers
  download-worker:
    build:
      context: .
      dockerfile: download-worker/Dockerfile
    environment:
      - TZ=UTC
      - COOKIES_FILE_PATH=/app/cookies.txt
    env_file:
      - ./.env
    volumes:
      - ./storage:/app/storage
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 100M
    cpu_quota: 100000     
    memswap_limit: 4G
    restart: unless-stopped

  # Transcribe Workers
  transcribe-worker:
    build:
      context: .
      dockerfile: transcribe-worker/Dockerfile
    environment:
      - TZ=UTC
    env_file:
      - ./.env
    volumes:
      - ./storage:/app/storage
      - /etc/localtime:/etc/localtime:ro 
      - /etc/timezone:/etc/timezone:ro
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 5G
          cpus: '2.5'
        reservations:
          memory: 1G
          cpus: '0.5'
    memswap_limit: 10G
    restart: unless-stopped

  # Clip Workers
  clip-worker:
    build:
      context: .
      dockerfile: clip-worker/Dockerfile
    env_file:
      - ./.env
    environment:
      - TZ=UTC 
    volumes:
      - ./storage:/app/storage
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 3.5G
          cpus: '2.5'
        reservations:
          memory: 1G
          cpus: '0.5'
    memswap_limit: 10G
    restart: unless-stopped
volumes:
  redis_data:
    driver: local