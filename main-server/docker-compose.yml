services:
  # Redis - Message Broker and Result Backend
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # API Gateway - FastAPI application
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./api-gateway/.env
    volumes:
      - ./storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Download Workers
  download-worker:
    build:
      context: .
      dockerfile: download-worker/Dockerfile
    env_file:
      - ./download-worker/.env
    volumes:
      - ./storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: 2
    restart: unless-stopped

  # Transcribe Workers
  transcribe-worker:
    build:
      context: .
      dockerfile: transcribe-worker/Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_BASE_PATH=/app/storage
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - EMAIL_SERVER_URL=http://email-server:8080/send-completion-email
    env_file:
      - ./transcribe-worker/.env
    volumes:
      - ./storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: 1
    restart: unless-stopped

  # Clip Workers
  clip-worker:
    build:
      context: .
      dockerfile: clip-worker/Dockerfile
    env_file:
      - ./clip-worker/.env
    volumes:
      - ./storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: 1
    restart: unless-stopped

  # Celery Flower
  flower:
    image: mher/flower:0.9.7
    ports:
      - "5555:5555"
    env_file:
      - ./.env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
