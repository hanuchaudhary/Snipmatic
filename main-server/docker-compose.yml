version: '3.8'

services:
  # Redis - Message Broker and Result Backend
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
   

  # API Gateway - FastAPI application
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./api-gateway/.env
    volumes:
      - ./storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    

  # Download Workers - Handle video downloading (I/O bound)
  download-worker:
    build:
      context: .
      dockerfile: download-worker/Dockerfile
    env_file:
      - ./download-worker/.env
    volumes:
      - ./storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: 2  # 2 workers × 3 concurrency x 5 workers = 30 concurrent downloads
    restart: unless-stopped
   

  # Transcribe Workers - Handle audio transcription and AI analysis (GPU bound)
  transcribe-worker:
    build:
      context: .
      dockerfile: transcribe-worker/Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_BASE_PATH=/app/storage
      - GEMINI_API_KEY=AIzaSyD20JPRpK2A2eqHyIHFbQ8MLh3CuSjONaM
      - EMAIL_SERVER_URL=http://email-server:8080/send-completion-email
    env_file:
      - ./transcribe-worker/.env
    volumes:
      - ./storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: 1  # 2 workers × 1 concurrency = 2 concurrent transcriptions (1 per CPU)
      # resources:
      #   reservations:
      #     devices:
      #       - driver: nvidia
      #         count: 1
      #         capabilities: [gpu]
    restart: unless-stopped
    

  # Clip Workers - Handle video clip generation (CPU bound)
  clip-worker:
    build:
      context: .
      dockerfile: clip-worker/Dockerfile
    env_file:
      - ./clip-worker/.env
    volumes:
      - ./storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: 1  # 2 workers × 4 concurrency = 8 concurrent clip creations x 5 threads = 40 for ai multi-clips
    restart: unless-stopped
   

  # Celery Flower - Web-based monitoring tool for Celery tasks
  flower:
    image: mher/flower:0.9.7
    ports:
      - "5555:5555"
    env_file:
      - ./.env
      
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Uncomment the following section to enable Nginx as a reverse proxy and file server
  
  # Nginx - Reverse proxy and file serving
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./storage:/usr/share/nginx/html/storage:ro
  #   depends_on:
  #     - api-gateway
  #   restart: unless-stopped

volumes:
  redis_data:
    driver: local
