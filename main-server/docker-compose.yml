services:
  # Redis - Message Broker and Result Backend
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # API Gateway - FastAPI application
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    env_file:
      - ./.env
    volumes:
      - ./storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Download Workers
  download-worker:
    build:
      context: .
      dockerfile: download-worker/Dockerfile
    environment:
      - TZ=UTC
      - COOKIES_FILE_PATH=/app/cookies.txt
    env_file:
      - ./.env
    volumes:
      - ./storage:/app/storage
      - /etc/localtime:/etc/localtime:ro  # Sync time with host
      - /etc/timezone:/etc/timezone:ro
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: 2
    restart: unless-stopped

  # Transcribe Workers
  transcribe-worker:
    build:
      context: .
      dockerfile: transcribe-worker/Dockerfile
    environment:
      - TZ=UTC
    env_file:
      - ./.env
    volumes:
      - ./storage:/app/storage
      - /etc/localtime:/etc/localtime:ro 
      - /etc/timezone:/etc/timezone:ro
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: 1
    restart: unless-stopped

  # Clip Workers
  clip-worker:
    build:
      context: .
      dockerfile: clip-worker/Dockerfile
    env_file:
      - ./.env
    environment:
      - TZ=UTC 
    volumes:
      - ./storage:/app/storage
      - /etc/localtime:/etc/localtime:ro  # Sync time with host
      - /etc/timezone:/etc/timezone:ro
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: 1
    restart: unless-stopped

  # Celery Flower
  flower:
    image: mher/flower:2.0.1
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - FLOWER_PORT=5555
      - FLOWER_BROKER=redis://redis:6379/0
      - FLOWER_BASIC_AUTH=admin:password
      - TZ=UTC
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: ["celery", "flower", "--broker=redis://redis:6379/0", "--port=5555", "--persistent=true", "--db=/data/flower.db"]

  # Add nginx service
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"  # Expose nginx on port 80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./storage:/usr/share/nginx/html/storage:ro  # For static file serving
    depends_on:
      - api-gateway
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
