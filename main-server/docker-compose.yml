  #     redis:
  #       condition: service_healthy
  #   restart: unless-stopped
  #   command: ["celery", "flower", "--broker=redis://redis:6379/0", "--port=5555", "--persistent=true", "--db=/data/flower.db"]

  # Add nginx service
  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./storage:/usr/share/nginx/html/storage:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx  # Log to host for monitoring
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'

