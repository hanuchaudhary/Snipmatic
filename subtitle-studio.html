<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>CaptionForge</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Montserrat:wght@800&family=Poppins:wght@800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #fafafa;
        --pn: #ffffff;
        --tx: #171717;
        --mu: #737373;
        --bd: #e5e5e5;
        --bd-strong: #d4d4d4;
        --ac: #171717;
        --ac-fg: #ffffff;
        --in: #fafafa;
        --focus: #a3a3a3;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #000000;
          --pn: #0a0a0a;
          --tx: #ededed;
          --mu: #8a8a8a;
          --bd: #262626;
          --bd-strong: #3a3a3a;
          --ac: #ededed;
          --ac-fg: #000000;
          --in: #0a0a0a;
          --focus: #737373;
        }
      }

      :root[data-theme="dark"] {
        --bg: #000000;
        --pn: #0a0a0a;
        --tx: #ededed;
        --mu: #8a8a8a;
        --bd: #262626;
        --bd-strong: #3a3a3a;
        --ac: #ededed;
        --ac-fg: #000000;
        --in: #0a0a0a;
        --focus: #737373;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }

      body {
        margin: 0;
        width: 100%;
        height: 100vh;
        min-height: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--tx);
        font:
          13px/1.45 Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      header {
        height: 56px;
        flex: 0 0 56px;
        padding: 0 24px;
        border-bottom: 1px solid var(--bd);
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--pn);
      }

      header h1 {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        line-height: 1;
        letter-spacing: -0.01em;
        font-weight: 600;
        margin: 0;
      }

      .brand-mark {
        display: inline-grid;
        place-items: center;
        width: 22px;
        height: 22px;
        background: var(--tx);
        color: var(--pn);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: -0.04em;
      }

      header span {
        color: var(--mu);
        font-size: 12px;
        border-left: 1px solid var(--bd);
        padding-left: 10px;
      }

      main {
        display: grid;
        grid-template-columns: 320px minmax(0, 1fr);
        gap: 0;
        width: 100%;
        height: calc(100vh - 56px);
        min-height: 0;
        max-width: 1500px;
        margin: 0 auto;
        border-left: 1px solid var(--bd);
        border-right: 1px solid var(--bd);
      }

      @media (max-width: 860px) {
        body {
          overflow: hidden;
        }

        main {
          grid-template-columns: 1fr;
          height: calc(100vh - 56px);
          overflow: hidden;
          border-left: 0;
          border-right: 0;
        }

        #ctl {
          height: 44vh;
          max-height: 44vh;
          border-right: 0;
          border-bottom: 1px solid var(--bd);
        }

        .stage {
          height: 56vh;
          overflow: hidden;
        }

        .cvw {
          height: 34vh;
          min-height: 220px;
        }

        canvas {
          max-height: 32vh;
        }
      }

      .panel {
        background: var(--pn);
        border: 1px solid var(--bd);
        border-radius: 0;
        padding: 16px;
      }

      #ctl {
        display: flex;
        flex-direction: column;
        gap: 8px;
        height: 100%;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        border: 0;
        border-right: 1px solid var(--bd);
        padding: 20px;
      }

      @media (max-width: 860px) {
        #ctl {
          max-height: none;
          border-right: 0;
          border-bottom: 1px solid var(--bd);
        }
      }

      h2 {
        font-size: 11px;
        line-height: 1;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-weight: 500;
        color: var(--mu);
        margin: 18px 0 6px;
        padding-top: 14px;
        border-top: 1px solid var(--bd);
      }

      h2:first-child {
        margin-top: 0;
        padding-top: 0;
        border-top: 0;
      }

      .r {
        display: grid;
        grid-template-columns: 105px minmax(0, 1fr) 42px;
        align-items: center;
        gap: 10px;
        min-height: 32px;
      }

      .r.w {
        grid-template-columns: 105px minmax(0, 1fr);
      }

      .r label {
        color: var(--mu);
        font-size: 12px;
      }

      .r output {
        font-size: 11px;
        text-align: right;
        color: var(--mu);
        font-variant-numeric: tabular-nums;
      }

      input[type="range"] {
        width: 100%;
        height: 4px;
        accent-color: var(--ac);
        cursor: pointer;
      }

      input[type="color"] {
        width: 100%;
        height: 30px;
        border: 1px solid var(--bd-strong);
        border-radius: 0;
        background: var(--in);
        padding: 3px;
        cursor: pointer;
      }

      input[type="checkbox"] {
        width: 14px;
        height: 14px;
        margin: 0;
        accent-color: var(--ac);
      }

      input[type="file"] {
        width: 100%;
        min-width: 0;
        font-size: 11px;
        color: var(--mu);
      }

      select,
      textarea {
        width: 100%;
        background: var(--pn);
        color: var(--tx);
        border: 1px solid var(--bd-strong);
        border-radius: 0;
        padding: 7px 9px;
        outline: none;
      }

      select {
        height: 32px;
        cursor: pointer;
      }

      textarea {
        resize: vertical;
      }

      select:focus,
      textarea:focus,
      input:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 1px;
      }

      textarea {
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12px;
        line-height: 1.55;
      }

      button,
      .btn {
        background: var(--ac);
        color: var(--ac-fg);
        border: 1px solid var(--ac);
        border-radius: 0;
        min-height: 34px;
        padding: 7px 12px;
        font: 600 12px inherit;
        cursor: pointer;
        letter-spacing: -0.01em;
        transition:
          opacity 120ms ease,
          background 120ms ease;
      }

      button:hover,
      .btn:hover {
        opacity: 0.86;
      }

      button.g,
      .btn.g {
        background: var(--pn);
        color: var(--tx);
        border: 1px solid var(--bd-strong);
      }

      button.g:hover,
      .btn.g:hover {
        background: var(--in);
        opacity: 1;
      }

      .stage {
        display: flex;
        flex-direction: column;
        gap: 0;
        min-width: 0;
        min-height: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
      }

      .stage > .panel {
        border: 0;
        border-bottom: 1px solid var(--bd);
        padding: 16px;
        min-height: 0;
      }

      .cvw {
        display: flex;
        justify-content: center;
        align-items: center;
        height: calc(100vh - 150px);
        min-height: 300px;
        background:
          linear-gradient(45deg, #f1f1f1 25%, transparent 25%),
          linear-gradient(-45deg, #f1f1f1 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #f1f1f1 75%),
          linear-gradient(-45deg, transparent 75%, #f1f1f1 75%);
        background-size: 20px 20px;
        background-position:
          0 0,
          0 10px,
          10px -10px,
          -10px 0;
        border: 1px solid var(--bd);
        border-radius: 0;
        padding: 16px;
      }

      @media (prefers-color-scheme: dark) {
        .cvw {
          background:
            linear-gradient(45deg, #111 25%, transparent 25%),
            linear-gradient(-45deg, #111 25%, transparent 25%),
            linear-gradient(45deg, transparent 75%, #111 75%),
            linear-gradient(-45deg, transparent 75%, #111 75%);
          background-size: 20px 20px;
          background-position:
            0 0,
            0 10px,
            10px -10px,
            -10px 0;
        }
      }

      canvas {
        max-width: 100%;
        max-height: 64vh;
        width: auto;
        height: auto;
        border-radius: 0;
        display: block;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.12);
      }

      .bar {
        display: grid;
        grid-template-columns: auto minmax(120px, 1fr) auto auto;
        gap: 8px;
        padding: 0 30px;
        align-items: center;
        width: 100%;
        min-height: 42px;
        padding-top: 12px;
      }

      .bar #pp {
        flex: 0 0 auto;
        min-width: 64px;
      }

      .bar input[type="range"] {
        width: 100%;
        min-width: 0;
        margin: 0;
      }

      .bar small {
        color: var(--mu);
        font-variant-numeric: tabular-nums;
        min-width: 46px;
        text-align: right;
        white-space: nowrap;
      }

      .bar label {
        color: var(--tx);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 34px;
        padding: 0 10px;
        border: 1px solid var(--bd-strong);
        background: var(--pn);
        font-size: 12px;
        white-space: nowrap;
        cursor: pointer;
      }

      .bar label input {
        flex: 0 0 auto;
      }

      @media (max-width: 600px) {
        .bar {
          grid-template-columns: auto minmax(0, 1fr) auto;
        }

        .bar label {
          grid-column: 1 / -1;
          justify-self: start;
        }
      }

      .stage > .panel:last-child {
        flex: 0 0 auto;
        overflow: hidden;
      }

      .ex {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .ex button {
        width: 100%;
      }

      video {
        max-width: 100%;
        max-height: 50vh;
        border-radius: 0;
        border: 1px solid var(--bd);
      }

      p.n {
        color: var(--mu);
        font-size: 11px;
        margin: 8px 0 0;
        line-height: 1.55;
      }

      #out {
        background: var(--in);
        border-color: var(--bd);
      }

      ::selection {
        background: var(--tx);
        color: var(--pn);
      }

      /* Keep the editor viewport clean; only the settings column may scroll
         when the physical viewport is too short to fit every setting. */
      * {
        scrollbar-width: none;
      }

      *::-webkit-scrollbar {
        display: none;
      }

      .export-trigger {
        flex: 0 0 auto;
        display: flex;
        justify-content: flex-end;
        padding: 12px 16px;
        border-top: 1px solid var(--bd);
        background: var(--pn);
      }

      .export-open {
        min-width: 90px;
      }

      .export-modal {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .export-modal.open {
        display: flex;
      }

      .export-backdrop {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(3px);
      }

      .export-dialog {
        position: relative;
        z-index: 1;
        width: min(720px, 100%);
        max-height: min(760px, calc(100vh - 48px));
        overflow: auto;
        background: var(--pn);
        border: 1px solid var(--bd-strong);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.25);
        padding: 20px;
      }

      .export-dialog-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 18px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--bd);
      }

      .export-title {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .export-subtitle {
        margin-top: 4px;
        color: var(--mu);
        font-size: 12px;
      }

      .modal-close {
        width: 30px;
        height: 30px;
        min-height: 30px;
        padding: 0;
        background: transparent;
        color: var(--mu);
        border: 1px solid var(--bd);
        font-size: 20px;
        line-height: 1;
        font-weight: 400;
      }

      .modal-close:hover {
        color: var(--tx);
        background: var(--in);
        opacity: 1;
      }

      .export-dialog .ex {
        margin-bottom: 12px;
      }

      .export-dialog #out {
        margin-top: 0;
        min-height: 220px;
        max-height: 38vh;
      }

      .export-dialog #vid {
        margin-top: 12px;
      }

      .export-dialog #vid video {
        display: block;
        width: 100%;
        max-height: 38vh;
        object-fit: contain;
        background: #000;
      }

      .export-dialog .n {
        margin-bottom: 0;
      }

      @media (max-width: 600px) {
        .export-modal {
          padding: 12px;
          align-items: flex-end;
        }

        .export-dialog {
          max-height: calc(100vh - 24px);
          padding: 16px;
        }

        .export-dialog .ex {
          grid-template-columns: 1fr;
        }
      }

      .tx {
        width: 100%;
        height: 100%;
        min-height: 200px;
        padding: 10px;
        border: 1px solid var(--bd);
        border-radius: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 class="brand"><span class="brand-mark">CF</span> CaptionForge</h1>
      <span>ASS Caption Editor</span>
    </header>
    <main>
      <div class="panel" id="ctl"></div>
      <div class="stage">
        <div class="panel">
          <div class="cvw"><canvas id="cv"></canvas></div>
        </div>
        <div class="export-trigger">
          <div class="bar">
            <button id="pp">Play</button>
            <input
              type="range"
              id="seek"
              min="0"
              max="1"
              step="0.01"
              value="0"
            />
            <small id="tm">0.00s</small>
            <label><input type="checkbox" id="loop" checked /> loop</label>
          </div>
          <button id="openExport" class="export-open">Export</button>
        </div>
      </div>
    </main>
    <div class="export-modal" id="exportModal" aria-hidden="true">
      <div class="export-backdrop" id="exportBackdrop"></div>
      <section
        class="export-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="exportTitle"
      >
        <div class="export-dialog-head">
          <div>
            <div class="export-title" id="exportTitle">Export</div>
            <div class="export-subtitle">
              Copy your ASS output or record a preview.
            </div>
          </div>
          <button id="closeExport" class="modal-close" aria-label="Close">
            ×
          </button>
        </div>

        <div class="ex">
          <button id="cs">Copy style line</button>
          <button id="cf">Copy full .ass</button>
          <button id="rec" class="g">Record WebM preview</button>
          <button id="rs" class="g">Reset settings</button>
        </div>

        <textarea id="out" rows="12" readonly></textarea>

        <div id="vid"></div>

        <p class="n">
          Recorded video plays below; use the player's menu to download it.
          Installed fonts must match the font name in the .ass (use libass
          fontsdir for custom fonts).
        </p>
      </section>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const cv = $("cv"),
        ctx = cv.getContext("2d");
      const FONTS = [
        "Arial",
        "Impact",
        "Verdana",
        "Georgia",
        "Trebuchet MS",
        "Courier New",
        "Comic Sans MS",
        "Anton",
        "Bangers",
        "Montserrat",
        "Poppins",
      ];
      const AL = [
        [2, "Bottom center"],
        [1, "Bottom left"],
        [3, "Bottom right"],
        [5, "Middle center"],
        [4, "Middle left"],
        [6, "Middle right"],
        [8, "Top center"],
        [7, "Top left"],
        [9, "Top right"],
      ];
      const RES = [
        ["1080x1920", "1080 x 1920 (9:16)"],
        ["1920x1080", "1920 x 1080 (16:9)"],
        ["1080x1080", "1080 x 1080 (1:1)"],
      ];
      const MODES = [
        ["swap", "Color swap (per word)"],
        ["kf", "Karaoke fill (\\kf)"],
      ];
      const F = [
        ["h", "Font"],
        ["font", "Family", "font", FONTS, "Anton"],
        ["size", "Size", "range", [20, 220, 1], 92],
        ["bold", "Bold", "check", 0, false],
        ["italic", "Italic", "check", 0, false],
        ["upper", "Uppercase", "check", 0, true],
        ["spacing", "Letter spacing", "range", [-5, 20, 0.5], 1],
        ["h", "Colors"],
        ["color", "Base", "color", 0, "#ffffff"],
        ["hl", "Highlight", "color", 0, "#ffd400"],
        ["outC", "Outline", "color", 0, "#000000"],
        ["shC", "Shadow", "color", 0, "#000000"],
        ["bg", "Preview bg", "color", 0, "#1f2b3d"],
        ["h", "Border & shadow"],
        ["out", "Outline width", "range", [0, 24, 0.5], 7],
        ["sh", "Shadow depth", "range", [0, 24, 0.5], 3],
        ["h", "Highlight"],
        ["mode", "Mode", "select", MODES, "swap"],
        ["pop", "Active scale %", "range", [80, 180, 1], 118],
        ["wpl", "Words per line", "range", [1, 8, 1], 3],
        ["h", "Animation"],
        ["tilt", "Word tilt \\frz", "range", [-30, 30, 1], -4],
        ["fadIn", "Fade in ms", "range", [0, 600, 10], 100],
        ["fadOut", "Fade out ms", "range", [0, 600, 10], 100],
        ["h", "Box"],
        ["box", "Opaque box", "check", 0, false],
        ["boxOnly", "Active word only", "check", 0, false],
        ["boxC", "Box color", "color", 0, "#000000"],
        ["boxA", "Box opacity %", "range", [0, 100, 1], 80],
        ["h", "Position"],
        ["align", "Alignment", "select", AL, 2],
        ["mv", "Margin V", "range", [0, 700, 1], 280],
        ["ml", "Margin L", "range", [0, 400, 1], 60],
        ["mr", "Margin R", "range", [0, 400, 1], 60],
        ["res", "Resolution", "select", RES, "1080x1920"],
        ["two", "Balanced 2 lines \\N", "check", 0, false],
        ["usePos", "Pin with \\pos", "check", 0, false],
        ["px", "Pos X", "range", [0, 1920, 1], 540],
        ["py", "Pos Y", "range", [0, 1920, 1], 1500],
      ];
      const S = {};
      let SV = {};
      try {
        SV = JSON.parse(localStorage.getItem("ass_cfg") || "{}");
      } catch (e) {}
      const ctl = $("ctl");
      F.forEach(([k, l, t, x, d]) => {
        if (k === "h") {
          const h = document.createElement("h2");
          h.textContent = l;
          ctl.appendChild(h);
          return;
        }
        const r = document.createElement("div");
        r.className = "r" + (t === "range" ? "" : " w");
        const lb = document.createElement("label");
        lb.textContent = l;
        lb.htmlFor = "c_" + k;
        r.appendChild(lb);
        let el;
        if (t === "range") {
          el = document.createElement("input");
          el.type = "range";
          [el.min, el.max, el.step] = x;
          el.value = d;
        } else if (t === "color") {
          el = document.createElement("input");
          el.type = "color";
          el.value = d;
        } else if (t === "check") {
          el = document.createElement("input");
          el.type = "checkbox";
          el.checked = d;
        } else {
          el = document.createElement("select");
          x.forEach((o) => {
            const op = document.createElement("option");
            const a = Array.isArray(o);
            op.value = a ? o[0] : o;
            op.textContent = a ? o[1] : o;
            el.appendChild(op);
          });
          el.value = d;
        }
        el.id = "c_" + k;
        r.appendChild(el);
        if (SV[k] !== undefined) {
          if (t === "check") el.checked = SV[k];
          else {
            const pv = el.value;
            el.value = SV[k];
            if (el.value === "" && t !== "range" && t !== "color")
              el.value = pv;
          }
        }
        ctl.appendChild(r);
        let out;
        if (t === "range") {
          out = document.createElement("output");
          out.textContent = d;
          r.appendChild(out);
        }
        const read = () => {
          S[k] =
            t === "check"
              ? el.checked
              : t === "range"
                ? +el.value
                : t === "select" && k === "align"
                  ? +el.value
                  : el.value;
          if (out) out.textContent = el.value;
        };
        el.addEventListener("input", () => {
          read();
          refresh();
        });
        read();
      });
      const fr = document.createElement("div");
      fr.className = "r w";
      fr.innerHTML =
        '<label>Add font</label><input type="file" id="ff" accept=".ttf,.otf,.woff,.woff2">';
      ctl.insertBefore(fr, $("c_font").parentNode.nextSibling);
      $("ff").onchange = async (e) => {
        const f = e.target.files[0];
        if (!f) return;
        const name = f.name.replace(/\.[^.]+$/, "");
        try {
          const ff = new FontFace(name, await f.arrayBuffer());
          await ff.load();
          document.fonts.add(ff);
          const s = $("c_font");
          const op = document.createElement("option");
          op.value = op.textContent = name;
          s.appendChild(op);
          s.value = name;
          S.font = name;
          refresh();
        } catch (err) {
          alert("Could not load font");
        }
      };
      const th = document.createElement("h2");
      th.textContent = "Transcript (auto word timing)";
      ctl.appendChild(th);
      const tx = document.createElement("textarea");
      tx.className = "tx";
      tx.rows = 4;
      tx.value =
        SV._text ||
        "Build captions that pop with every single word you say on screen";
      tx.addEventListener("input", () => {
        buildWords();
        refresh();
      });
      ctl.appendChild(tx);

      let W = [],
        dur = 1;
      function buildWords() {
        let t = 0.2;
        W = [];
        tx.value
          .trim()
          .split(/\s+/)
          .filter(Boolean)
          .forEach((w) => {
            const d = 0.22 + 0.035 * w.length;
            W.push({ w, s: t, e: t + d });
            t += d + 0.04;
          });
        dur = t;
        $("seek").max = dur + 0.4;
      }
      function groups() {
        const g = [];
        for (let i = 0; i < W.length; i += S.wpl) g.push(W.slice(i, i + S.wpl));
        return g;
      }
      const bgr = (h) => h.slice(5, 7) + h.slice(3, 5) + h.slice(1, 3);
      const ac = (h) => "&H00" + bgr(h);
      const ov = (h) => "&H" + bgr(h) + "&";
      const ts = (t) => {
        t = Math.max(0, t);
        const h = Math.floor(t / 3600),
          m = Math.floor((t % 3600) / 60),
          s = t % 60;
        return (
          h +
          ":" +
          String(m).padStart(2, "0") +
          ":" +
          s.toFixed(2).padStart(5, "0")
        );
      };
      const txt = (w) => (S.upper ? w.toUpperCase() : w);
      const alp = (q) =>
        "&H" +
        Math.round(((100 - q) / 100) * 255)
          .toString(16)
          .toUpperCase()
          .padStart(2, "0") +
        "&";
      const acA = (c, q) => alp(q).slice(0, -1) + bgr(c);
      const hexA = (c, a) => {
        const n = parseInt(c.slice(1), 16);
        return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
      };
      const brk = (g) => (S.two && g.length > 1 ? Math.ceil(g.length / 2) : -1);
      const joinW = (g, f) => {
        const b = brk(g);
        return g
          .map((w, j) => (j ? (j === b ? "\\N" : " ") : "") + f(w, j))
          .join("");
      };
      const wrap = (s) => (s ? "{" + s + "}" : "");
      const fadT = (a, c) => (a || c ? `\\fad(${a},${c})` : "");
      function styleLine() {
        const kf = S.mode === "kf";
        const oc = S.box ? acA(S.boxC, S.boxA) : ac(S.outC);
        return `Style: Default,${S.font},${S.size},${kf ? ac(S.hl) : ac(S.color)},${kf ? ac(S.color) : ac(S.hl)},${oc},${ac(S.shC)},${S.bold ? -1 : 0},${S.italic ? -1 : 0},0,0,100,100,${S.spacing},0,${S.box ? 3 : 1},${S.out},${S.sh},${S.align},${S.ml},${S.mr},${S.mv},1`;
      }
      function buildAss() {
        const [rx, ry] = S.res.split("x");
        const pos = S.usePos ? `\\pos(${S.px},${S.py})` : "";
        const bo = S.box && S.boxOnly && S.mode !== "kf";
        let a = `[Script Info]\nScriptType: v4.00+\nPlayResX: ${rx}\nPlayResY: ${ry}\nWrapStyle: 2\nScaledBorderAndShadow: yes\n\n[V4+ Styles]\nFormat: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding\n${styleLine()}\n\n[Events]\nFormat: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text\n`;
        groups().forEach((g) => {
          if (S.mode === "kf") {
            const body = joinW(
              g,
              (w) => `{\\kf${Math.round((w.e - w.s) * 100)}}${txt(w.w)}`
            );
            a += `Dialogue: 0,${ts(g[0].s)},${ts(g[g.length - 1].e)},Default,,0,0,0,,${wrap(pos + fadT(S.fadIn, S.fadOut))}${body}\n`;
          } else {
            g.forEach((w, i) => {
              const end = g[i + 1] ? g[i + 1].s : w.e;
              const lead = wrap(
                pos +
                  fadT(
                    i === 0 ? S.fadIn : 0,
                    i === g.length - 1 ? S.fadOut : 0
                  ) +
                  (bo ? "\\3a&HFF&" : "")
              );
              const body = joinW(g, (x, j) => {
                if (j !== i) return txt(x.w);
                const t1 =
                  `\\c${ov(S.hl)}\\fscx${S.pop}\\fscy${S.pop}\\frz${S.tilt}` +
                  (bo ? `\\3c${ov(S.boxC)}\\3a${alp(S.boxA)}` : "");
                return `{${t1}}${txt(x.w)}{\\r${bo ? "\\3a&HFF&" : ""}}`;
              });
              a += `Dialogue: 0,${ts(w.s)},${ts(end)},Default,,0,0,0,,${lead}${body}\n`;
            });
          }
        });
        return a;
      }
      function fontStr() {
        return `${S.italic ? "italic " : ""}${S.bold ? "bold " : ""}${S.size}px "${S.font}"`;
      }
      function paint(s, x, y, fill, clipW) {
        ctx.save();
        ctx.translate(x, y);
        if (clipW != null) {
          ctx.beginPath();
          ctx.rect(-1e5, -1e5, 1e5 + clipW, 2e5);
          ctx.clip();
        }
        if (clipW == null && !S.box) {
          ctx.lineJoin = "round";
          ctx.lineWidth = S.out * 2;
          if (S.sh > 0) {
            ctx.fillStyle = S.shC;
            ctx.strokeStyle = S.shC;
            if (S.out > 0) ctx.strokeText(s, S.sh, S.sh);
            ctx.fillText(s, S.sh, S.sh);
          }
          if (S.out > 0) {
            ctx.strokeStyle = S.outC;
            ctx.strokeText(s, 0, 0);
          }
        }
        ctx.fillStyle = fill;
        ctx.fillText(s, 0, 0);
        ctx.restore();
      }
      function draw(t) {
        const [rx, ry] = S.res.split("x").map(Number);
        if (cv.width !== rx || cv.height !== ry) {
          cv.width = rx;
          cv.height = ry;
        }
        ctx.globalAlpha = 1;
        ctx.clearRect(0, 0, rx, ry);
        const g = ctx.createLinearGradient(0, 0, rx, ry);
        g.addColorStop(0, S.bg);
        g.addColorStop(1, "#000");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, rx, ry);
        const gr = groups().find(
          (q) => t >= q[0].s && t < q[q.length - 1].e + 0.02
        );
        if (!gr) return;
        let al = 1;
        if (S.fadIn > 0) al = Math.min(al, ((t - gr[0].s) * 1000) / S.fadIn);
        if (S.fadOut > 0)
          al = Math.min(al, ((gr[gr.length - 1].e - t) * 1000) / S.fadOut);
        ctx.globalAlpha = Math.max(0, Math.min(1, al));
        ctx.font = fontStr();
        ctx.textBaseline = "alphabetic";
        ctx.textAlign = "left";
        ctx.letterSpacing = S.spacing + "px";
        const sp = ctx.measureText(" ").width;
        const b = brk(gr);
        const rows = b > 0 ? [gr.slice(0, b), gr.slice(b)] : [gr];
        const meas = rows.map((r) => {
          const ws = r.map((w) => ctx.measureText(txt(w.w)).width);
          return {
            r,
            ws,
            tot: ws.reduce((x, y) => x + y, 0) + sp * (r.length - 1),
          };
        });
        const lh = S.size * 1.15,
          bh = lh * rows.length;
        const col = (S.align - 1) % 3,
          row = Math.floor((S.align - 1) / 3);
        let ax, ay;
        if (S.usePos) {
          ax = S.px;
          ay = S.py;
        } else {
          ax =
            col === 0 ? S.ml : col === 1 ? (rx + S.ml - S.mr) / 2 : rx - S.mr;
          ay = row === 0 ? ry - S.mv : row === 1 ? ry / 2 : S.mv;
        }
        const top = row === 0 ? ay - bh : row === 1 ? ay - bh / 2 : ay;
        const pad = S.out,
          kf = S.mode === "kf";
        meas.forEach((m, li) => {
          let x = col === 0 ? ax : col === 1 ? ax - m.tot / 2 : ax - m.tot;
          const y = top + li * lh + S.size * 0.9;
          if (S.box && (!S.boxOnly || kf)) {
            ctx.fillStyle = hexA(S.boxC, S.boxA / 100);
            ctx.fillRect(
              x - pad,
              y - S.size * 0.85 - pad,
              m.tot + 2 * pad,
              S.size * 1.05 + 2 * pad
            );
          }
          m.r.forEach((w, i) => {
            const gi = gr.indexOf(w);
            const nx = gr[gi + 1] ? gr[gi + 1].s : w.e;
            const act = t >= w.s && t < nx;
            const s = txt(w.w),
              wd = m.ws[i];
            if (kf) {
              paint(s, x, y, S.color);
              if (t >= w.s) {
                const p = Math.min(1, (t - w.s) / (w.e - w.s));
                paint(s, x, y, S.hl, wd * p);
              }
            } else if (act) {
              if (S.box && S.boxOnly) {
                ctx.fillStyle = hexA(S.boxC, S.boxA / 100);
                ctx.fillRect(
                  x - pad,
                  y - S.size * 0.85 - pad,
                  wd + 2 * pad,
                  S.size * 1.05 + 2 * pad
                );
              }
              const cx = x + wd / 2,
                cy = y - S.size * 0.3,
                sc = S.pop / 100;
              ctx.save();
              ctx.translate(cx, cy);
              ctx.rotate((-S.tilt * Math.PI) / 180);
              ctx.scale(sc, sc);
              ctx.translate(-cx, -cy);
              paint(s, x, y, S.hl);
              ctx.restore();
            } else paint(s, x, y, S.color);
            x += wd + sp;
          });
        });
        ctx.globalAlpha = 1;
      }
      let playing = false,
        t = 0,
        last = 0,
        rec = null;
      function refresh() {
        document.fonts.load(fontStr()).then(() => {});
        $("out").value = buildAss();
        try {
          localStorage.setItem(
            "ass_cfg",
            JSON.stringify({ ...S, _text: tx.value })
          );
        } catch (e) {}
      }
      function tick(now) {
        if (playing) {
          t += (now - last) / 1000;
          last = now;
          if (t >= dur + 0.4) {
            if (rec) {
              playing = false;
              if (rec.state === "recording") rec.stop();
            } else if ($("loop").checked) t = 0;
            else {
              playing = false;
              t = 0;
            }
          }
        }
        draw(t);
        $("seek").value = t;
        $("tm").textContent = t.toFixed(2) + "s";
        $("pp").textContent = playing ? "Pause" : "Play";
        requestAnimationFrame(tick);
      }
      $("pp").onclick = () => {
        playing = !playing;
        last = performance.now();
      };
      $("seek").oninput = (e) => {
        t = +e.target.value;
        playing = false;
      };
      function copy(s) {
        const done = () => {};
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(s).catch(() => fb(s));
        } else fb(s);
        function fb(v) {
          const o = $("out"),
            p = o.value;
          o.value = v;
          o.select();
          try {
            document.execCommand("copy");
          } catch (e) {}
          o.value = p;
        }
      }
      function flash(b, m) {
        const o = b.textContent;
        b.textContent = m;
        setTimeout(() => (b.textContent = o), 1200);
      }
      $("rs").onclick = () => {
        try {
          localStorage.removeItem("ass_cfg");
        } catch (e) {}
        location.reload();
      };
      $("cs").onclick = (e) => {
        copy(styleLine());
        flash(e.target, "Copied");
      };
      $("cf").onclick = (e) => {
        copy(buildAss());
        flash(e.target, "Copied");
      };
      $("rec").onclick = (e) => {
        if (rec) return;
        if (!window.MediaRecorder) {
          alert("MediaRecorder not supported");
          return;
        }
        const btn = e.target;
        const mt = ["video/webm;codecs=vp9", "video/webm"].find((m) =>
          MediaRecorder.isTypeSupported(m)
        );
        const chunks = [];
        rec = new MediaRecorder(cv.captureStream(30), {
          mimeType: mt,
          videoBitsPerSecond: 8e6,
        });
        rec.ondataavailable = (ev) => chunks.push(ev.data);
        rec.onstop = () => {
          const url = URL.createObjectURL(
            new Blob(chunks, { type: "video/webm" })
          );
          $("vid").innerHTML =
            '<video controls loop autoplay muted src="' + url + '"></video>';
          rec = null;
          btn.textContent = "Record WebM preview";
        };
        t = 0;
        playing = true;
        last = performance.now();
        rec.start();
        btn.textContent = "Recording...";
      };

      const exportModal = $("exportModal");
      const openExport = $("openExport");
      const closeExport = $("closeExport");
      const exportBackdrop = $("exportBackdrop");

      function setExportOpen(open) {
        exportModal.classList.toggle("open", open);
        exportModal.setAttribute("aria-hidden", String(!open));
        document.body.style.overflow = open ? "hidden" : "";
        if (open) closeExport.focus();
        else openExport.focus();
      }

      openExport.onclick = () => setExportOpen(true);
      closeExport.onclick = () => setExportOpen(false);
      exportBackdrop.onclick = () => setExportOpen(false);

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && exportModal.classList.contains("open")) {
          setExportOpen(false);
        }
      });

      FONTS.slice(7).forEach((f) => document.fonts.load(`40px "${f}"`));
      buildWords();
      refresh();
      requestAnimationFrame(tick);
    </script>
  </body>
</html>
